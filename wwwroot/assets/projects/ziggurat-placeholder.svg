<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Ziggurat colorful placeholder preview</title>
  <desc id="desc">Temporary colorful website preview for the Ziggurat project card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#12131b"/>
      <stop offset="50%" stop-color="#101621"/>
      <stop offset="100%" stop-color="#0c1018"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" x2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" x2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" x2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" x2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="84" fill="#11141c"/>
  <circle cx="42" cy="42" r="9" fill="#ffffff" opacity=".8"/>
  <circle cx="72" cy="42" r="9" fill="#ffffff" opacity=".5"/>
  <circle cx="102" cy="42" r="9" fill="#ffffff" opacity=".25"/>
  <rect x="170" y="32" width="370" height="20" rx="10" fill="#ffffff" opacity=".12"/>
  <rect x="934" y="28" width="120" height="28" rx="14" fill="#ffffff" opacity=".10"/>
  <rect x="1070" y="28" width="150" height="28" rx="14" fill="#ffffff" opacity=".14"/>

  <rect x="72" y="126" width="1136" height="184" rx="34" fill="url(#hero)" filter="url(#shadow)"/>
  <rect x="110" y="162" width="260" height="24" rx="12" fill="#ffffff" opacity=".25"/>
  <rect x="110" y="206" width="520" height="56" rx="18" fill="#ffffff" opacity=".16"/>
  <rect x="954" y="158" width="176" height="120" rx="28" fill="#ffffff" opacity=".14"/>
  <circle cx="1044" cy="218" r="42" fill="#ffffff" opacity=".18"/>

  <rect x="72" y="360" width="252" height="180" rx="26" fill="url(#card1)" filter="url(#shadow)"/>
  <rect x="348" y="360" width="252" height="180" rx="26" fill="url(#card2)" filter="url(#shadow)"/>
  <rect x="624" y="360" width="252" height="180" rx="26" fill="url(#card3)" filter="url(#shadow)"/>
  <rect x="900" y="360" width="308" height="180" rx="26" fill="url(#card4)" filter="url(#shadow)"/>

  <rect x="72" y="590" width="380" height="24" rx="12" fill="#ffffff" opacity=".12"/>
  <rect x="72" y="632" width="520" height="18" rx="9" fill="#ffffff" opacity=".08"/>
  <rect x="72" y="672" width="270" height="18" rx="9" fill="#ffffff" opacity=".06"/>

  <text x="82" y="744" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" opacity=".72">Temporary colorful project preview</text>
</svg>